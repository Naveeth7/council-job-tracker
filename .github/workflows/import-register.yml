name: Review an updated sponsor register
on:
  workflow_dispatch:
    inputs:
      register_path:
        description: 'Path to the uploaded CSV in this repository, e.g. imports/sponsors.csv'
        required: true
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build a review file without overwriting confirmed links
        env:
          REGISTER_PATH: ${{ inputs.register_path }}
        run: go run ./cmd/tracker import-register -file "$REGISTER_PATH" -out import-review.csv
      - uses: actions/upload-artifact@v4
        with:
          name: sponsor-register-review
          path: import-review.csv
          retention-days: 14
