name: Inspect public recruitment pages
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-portals.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/portal-inspect playwright
      - run: /tmp/portal-inspect/node_modules/.bin/playwright install --with-deps chromium
      - name: Inspect rendered public pages
        shell: node {0}
        run: |
          const {chromium}=require('/tmp/portal-inspect/node_modules/playwright');
          const zlib=require('node:zlib');
          const urls=[
            'https://ce0872li.webitrent.com/ce0872li_webrecruitment/wrd/run/ETREC179GF.open?WVID=9966750H9s',
            'https://basbcli.webitrent.com/basbcli_webrecruitment/wrd/run/etrec179gf.open?wvid=7164787PyS',
            'https://ce0017li.webitrent.com/ce0017li_webrecruitment/wrd/run/ETREC179GF.open?WVID=8070960wxx'
          ];
          (async()=>{
            const browser=await chromium.launch();
            for(const url of urls){
              const context=await browser.newContext({userAgent:'CouncilJobTracker/1.0'});
              const page=await context.newPage();
              try{
                await page.goto(url,{waitUntil:'networkidle',timeout:45000});
                const body=await page.locator('body').innerText();
                if(/challenge|verify you are human/i.test(await page.title())){console.log('PORTAL_ERROR security challenge');continue;}
                const structure=await page.evaluate(()=>{
                  const d=document.documentElement.cloneNode(true);
                  d.querySelectorAll('script,style,input[type=hidden],textarea').forEach(x=>x.remove());
                  d.querySelectorAll('*').forEach(el=>{
                    for(const attr of [...el.attributes]){
                      if(!['class','id','name','type','role','aria-label','href','action'].includes(attr.name)){el.removeAttribute(attr.name);continue;}
                      if(['href','action'].includes(attr.name)){
                        try{const u=new URL(attr.value,location.href);el.setAttribute(attr.name,u.origin+u.pathname);}catch{el.removeAttribute(attr.name);}
                      }
                    }
                  });
                  return d.outerHTML.replace(/[a-f0-9]{20,}/gi,'[redacted]');
                });
                console.log('PORTAL_STRUCTURE '+zlib.gzipSync(JSON.stringify({url,structure})).toString('base64'));
              }catch(e){console.log('PORTAL_ERROR '+url+' '+e.message);}
              finally{await context.close();}
            }
            await browser.close();
          })();
