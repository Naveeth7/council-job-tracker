name: Inspect public recruitment pages
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/inspect-portals.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect public HTML without credentials
        shell: python
        run: |
          import csv, urllib.request, urllib.parse, urllib.robotparser, json, base64, gzip, re, time
          from html.parser import HTMLParser
          class Structure(HTMLParser):
            def __init__(self):
              super().__init__(); self.parts=[]; self.links=[]; self.skip=0
            def handle_starttag(self,t,attrs):
              d=dict(attrs)
              if t in ['script','style']: self.skip+=1; return
              if self.skip:return
              if t=='a' and d.get('href'):self.links.append(d['href'])
              a={k:v for k,v in attrs if k in ['class','id','name','type','action','href']}
              if t=='input' and d.get('name','').upper()=='WVID': a['value']=d.get('value','')
              if 'href' in a: a['href']=re.sub(r'(?:%1B|\x1b|&)(?:USESSION|SESSION)[^&]*','',a['href'],flags=re.I)
              self.parts.append('<'+t+' '+repr(a)+'>')
            def handle_endtag(self,t):
              if t in ['script','style']: self.skip=max(0,self.skip-1);return
              if not self.skip:self.parts.append('</'+t+'>')
            def handle_data(self,d):
              if not self.skip and d.strip():self.parts.append(d.strip())
          def read(url):
            origin=urllib.parse.urlsplit(url)
            rp=urllib.robotparser.RobotFileParser(origin.scheme+'://'+origin.netloc+'/robots.txt');rp.read()
            if not rp.can_fetch('CouncilJobTracker/1.0',url): raise RuntimeError('robots policy disallows')
            req=urllib.request.Request(url,headers={'User-Agent':'CouncilJobTracker/1.0'})
            raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
            p=Structure();p.feed(raw)
            print('PORTAL_STRUCTURE '+base64.b64encode(gzip.compress(json.dumps({'url':url,'structure':'\n'.join(p.parts)}).encode())).decode())
            time.sleep(1)
            return p
          for row in csv.DictReader(open('config/councils.csv')):
            if row['adapter']!='itrent':continue
            try:
              p=read(row['url'])
              all_links=[urllib.parse.urljoin(row['url'],u) for u in p.links if 'ETREC106GF' in u.upper()]
              if all_links:p=read(all_links[0])
              detail=[urllib.parse.urljoin(row['url'],u) for u in p.links if 'ETREC107GF' in u.upper()]
              if detail:read(detail[0])
            except Exception as e:print('PORTAL_ERROR '+row['name']+' '+str(e))
